site_name: 小红蚁使用文档
site_description: 小红书内容创作、对标监控与账号管理的一站式使用指南
site_author: 小红蚁团队
copyright: Copyright &copy; 2026 小红蚁

repo_url: https://github.com/magicCzc/Little-Red-Ant
edit_uri: edit/desktop-v2-tauri/docs/

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  font:
    text: Noto Sans SC
    code: Fira Code
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Chenzc-AIDev/小红蚁

nav:
  - 首页: index.md
  - 快速开始:
      - 安装与启动: getting-started/installation.md
      - 首次登录: getting-started/first-login.md
      - 界面总览: getting-started/dashboard-overview.md
  - 账号管理:
      - 绑定浏览权限: accounts/bind-preview.md
      - 绑定发布权限: accounts/bind-publish.md
      - 切换活跃账号: accounts/switch-account.md
      - 扫码失败排查: accounts/troubleshoot-login.md
  - 内容创作:
      - 生成笔记: content/generate-note.md
      - 生成视频脚本: content/generate-video.md
      - 封面编辑器: content/image-editor.md
      - 草稿与发布: content/drafts.md
      - 笔记管理: content/note-management.md
      - 热门笔记: content/trending-notes.md
      - 选题挖掘: content/topic-mining.md
      - 我的爆款: content/viral-knowledge.md
  - 视频工程:
      - 项目管理: video/video-projects.md
  - 对标监控:
      - 添加对标账号: competitor/add-competitor.md
      - AI 拆解爆款策略: competitor/analyze-strategy.md
      - 批量更新数据: competitor/batch-refresh.md
  - 互动管理:
      - 同步评论: engagement/sync-comments.md
      - AI 回复建议: engagement/auto-reply.md
  - 数据看板:
      - 数据概览: analytics/dashboard.md
  - 任务中心:
      - 任务管理: tasks/task-center.md
  - 系统设置:
      - 修改资料与密码: settings/profile.md
      - 配置 AI 模型: settings/ai-provider.md
      - 同步频率与限制: settings/cron-and-limit.md
  - 常见问题: faq.md
  - 更新日志: changelog.md
  - 开发文档:
      - 系统架构: ARCHITECTURE.md
      - 桌面端构建: DESKTOP_BUILD.md
      - 开发指南: DEVELOPMENT_GUIDE.md
      - 技术拆解：小红书运营工具选型指南: 小红蚁技术拆解-小红书运营工具选型指南.md
      - 深度解析：AI内容运营的技术实践: 小红蚁深度解析-AI内容运营的技术实践.md
