[package]
name = "xiaohongyi"
version = "1.0.0"
description = "小红蚁 - AI 智能小红书运营助手"
authors = ["magicCzc"]
edition = "2021"
rust-version = "1.77"

# Tauri 2 核心依赖
[lib]
name = "xiaohongyi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
# 后端健康检查
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

# Release 优化
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
